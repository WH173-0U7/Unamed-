<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>DarcVoyd</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@300;400&family=Quicksand:wght@400;500;600&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Special+Elite&family=VT323&display=swap"
    />
  </head>
  <body>
    <!-- The game: a television that, once on, lets you lurk -->
    <div id="game">
      <div id="screen"></div>
      <!-- Rain falling over the picture (behind the interface) -->
      <canvas id="rainfall"></canvas>
      <!-- Snow falling over the picture -->
      <canvas id="snowfall"></canvas>
      <button id="power-btn" type="button">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="M16.5 13.5a14 14 0 1 0 15 0" />
          <path d="M24 8v15" />
        </svg>
        <span>Turn on</span>
      </button>
      <!-- Your stats, and your blood and injuries -->
      <div id="stats" hidden></div>
      <div id="you-status" hidden></div>
      <!-- Who you saw when you lurked: shown as a button -->
      <div id="seen" hidden></div>
      <!-- An encounter with them: what you know, the log, your options -->
      <div id="enc" hidden></div>
      <!-- What happened while time passed -->
      <div id="note" hidden></div>
      <div id="idle-bar">
        <button id="rest-btn" type="button" hidden>
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path d="M31 8a17 17 0 1 0 9 26A14 14 0 0 1 31 8z" />
          </svg>
          <span>Rest</span>
        </button>
        <button id="lurk-btn" type="button" hidden>
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path d="M4 24c6-9 12.5-13 20-13s14 4 20 13c-6 9-12.5 13-20 13S10 33 4 24z" />
            <circle cx="24" cy="24" r="5.5" />
          </svg>
          <span>Lurk</span>
        </button>
      </div>
      <!-- Pull in from the edges: where to go (left), your pockets (right) -->
      <button id="go-btn" class="edge-tab edge-left" type="button" aria-label="Go somewhere" hidden>
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="M24 43s-13-13.5-13-23a13 13 0 0 1 26 0c0 9.5-13 23-13 23z" />
          <circle cx="24" cy="20" r="4.5" />
        </svg>
        <span>Go</span>
      </button>
      <button id="bag-btn" class="edge-tab edge-right" type="button" aria-label="Pockets" hidden>
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="M10 17h28l-2.5 23h-23z" />
          <path d="M17 17v-3a7 7 0 0 1 14 0v3" />
        </svg>
        <span>Pockets</span>
      </button>
      <!-- Pull up from the bottom: you (your stats and everything about you) -->
      <button id="you-btn" class="edge-tab edge-bottom" type="button" aria-label="You: your stats" hidden>
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="16" r="7" />
          <path d="M10 41c1.5-9 7-13 14-13s12.5 4 14 13" />
        </svg>
        <span>You</span>
      </button>
      <!-- A place you've gone to (the pharmacy) -->
      <div id="shop" hidden></div>
      <!-- Sheets that slide up: where to go, what's in your pockets -->
      <div id="sheet" hidden><div class="sheet-card"></div></div>
      <!-- The real time, from your device -->
      <div id="clock" aria-label="Time"><b></b><span></span></div>
      <button id="pause-btn" type="button" aria-label="Pause"><span></span><span></span></button>
    </div>

    <div id="fps"></div>

    <!-- Menus -->
    <div id="menu">
      <section class="screen" id="screen-main" aria-label="Main menu">
        <div class="brand">
          <h1 class="title" data-text="DarcVoyd">DarcVoyd</h1>
          <p class="version" id="version"></p>
        </div>
        <nav class="nav">
          <button type="button" id="btn-continue" hidden>
            Continue
            <span class="meta" id="continue-meta"></span>
          </button>
          <button type="button" id="btn-new">New game</button>
          <button type="button" data-go="settings">Settings</button>
          <button type="button" data-go="news">What’s new</button>
        </nav>
      </section>

      <section class="screen panel" id="screen-news" aria-label="What’s new">
        <header class="panel-head">
          <button type="button" class="back" data-back aria-label="Back">‹</button>
          <h2>What’s new</h2>
        </header>
        <div class="rows news-rows">
          <div class="news" id="news"></div>
          <button type="button" class="news-ok" data-back>OK</button>
        </div>
      </section>

      <section class="screen" id="screen-pause" aria-label="Paused">
        <div class="brand">
          <p class="eyebrow">paused</p>
          <p class="pause-meta" id="pause-meta"></p>
        </div>
        <nav class="nav">
          <button type="button" id="btn-resume">Resume</button>
          <button type="button" data-go="settings">Settings</button>
          <button type="button" id="btn-quit">Quit to menu</button>
        </nav>
      </section>

      <section class="screen panel" id="screen-confirm" aria-label="Confirm" role="alertdialog" aria-labelledby="confirm-title">
        <div class="dialog">
          <h2 id="confirm-title"></h2>
          <p id="confirm-body"></p>
          <div class="dialog-actions">
            <button type="button" class="btn" data-back>Cancel</button>
            <button type="button" class="btn btn-danger" id="confirm-ok"></button>
          </div>
        </div>
      </section>

      <section class="screen panel" id="screen-settings" aria-label="Settings">
        <header class="panel-head">
          <button type="button" class="back" data-back aria-label="Back">‹</button>
          <h2>Settings</h2>
        </header>
        <div class="rows">
          <div class="row">
            <span class="label" id="quality-label">Graphics</span>
            <div class="seg" id="set-quality" role="radiogroup" aria-labelledby="quality-label">
              <button type="button" role="radio" data-v="auto">Auto</button>
              <button type="button" role="radio" data-v="low">Low</button>
              <button type="button" role="radio" data-v="medium">Medium</button>
              <button type="button" role="radio" data-v="high">High</button>
            </div>
          </div>
          <p class="note" id="quality-note"></p>

          <div class="row">
            <span class="label" id="font-label">Lettering</span>
            <div class="seg" id="set-font" role="radiogroup" aria-labelledby="font-label">
              <button type="button" role="radio" data-v="report">Report</button>
              <button type="button" role="radio" data-v="typewriter">Typed</button>
              <button type="button" role="radio" data-v="terminal">CRT</button>
              <button type="button" role="radio" data-v="clean">Clean</button>
            </div>
          </div>
          <div class="row">
            <span class="label" id="buttons-label">Buttons</span>
            <div class="seg" id="set-buttons" role="radiogroup" aria-labelledby="buttons-label">
              <button type="button" role="radio" data-v="lines">Lines</button>
              <button type="button" role="radio" data-v="ghost">Ghost</button>
              <button type="button" role="radio" data-v="keyline">Keyline</button>
              <button type="button" role="radio" data-v="boxes">Boxes</button>
            </div>
          </div>
          <p class="note" id="style-note"></p>

          <div class="fx-sliders">
            <label class="row slider" for="set-grain"><span class="label">Film grain</span><input type="range" id="set-grain" min="0" max="100" step="5" /><output></output></label>
            <label class="row slider" for="set-glitch"><span class="label">Glitches</span><input type="range" id="set-glitch" min="0" max="100" step="5" /><output></output></label>
            <label class="row slider" for="set-static"><span class="label">Static</span><input type="range" id="set-static" min="0" max="100" step="5" /><output></output></label>
            <label class="row slider" for="set-fringe"><span class="label">Color fringe</span><input type="range" id="set-fringe" min="0" max="100" step="5" /><output></output></label>
          </div>

          <label class="row" for="set-sound">
            <span class="label">Sound</span>
            <input type="checkbox" class="switch" id="set-sound" />
          </label>

          <label class="row" for="set-fps">
            <span class="label">Show frame rate</span>
            <input type="checkbox" class="switch" id="set-fps" />
          </label>

          <div class="row" id="row-delete">
            <span class="label">
              Saved game
              <span class="label-sub" id="save-info"></span>
            </span>
            <button type="button" class="btn btn-danger btn-small" id="btn-delete-save">Delete</button>
          </div>
        </div>
      </section>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

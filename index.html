<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>DarcVoyd</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@300;400&family=Quicksand:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <!-- The game: a television that, once on, shows the map -->
    <div id="game">
      <div id="screen"></div>
      <button id="power-btn" type="button">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="M16.5 13.5a14 14 0 1 0 15 0" />
          <path d="M24 8v15" />
        </svg>
        <span>Turn on</span>
      </button>
      <button id="pause-btn" type="button" aria-label="Pause"><span></span><span></span></button>
    </div>

    <div id="fps"></div>

    <!-- Menus -->
    <div id="menu">
      <section class="screen" id="screen-main" aria-label="Main menu">
        <div class="brand">
          <h1 class="title" data-text="DarcVoyd">DarcVoyd</h1>
        </div>
        <nav class="nav">
          <button type="button" id="btn-continue" hidden>
            Continue
            <span class="meta" id="continue-meta"></span>
          </button>
          <button type="button" id="btn-new">New game</button>
          <button type="button" data-go="settings">Settings</button>
        </nav>
      </section>

      <section class="screen" id="screen-pause" aria-label="Paused">
        <div class="brand">
          <p class="eyebrow">paused</p>
          <p class="pause-meta" id="pause-meta"></p>
        </div>
        <nav class="nav">
          <button type="button" id="btn-resume">Resume</button>
          <button type="button" data-go="settings">Settings</button>
          <button type="button" id="btn-quit">Quit to menu</button>
        </nav>
      </section>

      <section class="screen panel" id="screen-confirm" aria-label="Confirm" role="alertdialog" aria-labelledby="confirm-title">
        <div class="dialog">
          <h2 id="confirm-title"></h2>
          <p id="confirm-body"></p>
          <div class="dialog-actions">
            <button type="button" class="btn" data-back>Cancel</button>
            <button type="button" class="btn btn-danger" id="confirm-ok"></button>
          </div>
        </div>
      </section>

      <section class="screen panel" id="screen-settings" aria-label="Settings">
        <header class="panel-head">
          <button type="button" class="back" data-back aria-label="Back">‹</button>
          <h2>Settings</h2>
        </header>
        <div class="rows">
          <div class="row">
            <span class="label" id="quality-label">Graphics</span>
            <div class="seg" id="set-quality" role="radiogroup" aria-labelledby="quality-label">
              <button type="button" role="radio" data-v="auto">Auto</button>
              <button type="button" role="radio" data-v="low">Low</button>
              <button type="button" role="radio" data-v="medium">Medium</button>
              <button type="button" role="radio" data-v="high">High</button>
            </div>
          </div>
          <p class="note" id="quality-note"></p>

          <label class="row" for="set-fps">
            <span class="label">Show frame rate</span>
            <input type="checkbox" class="switch" id="set-fps" />
          </label>

          <div class="row" id="row-delete">
            <span class="label">
              Saved game
              <span class="label-sub" id="save-info"></span>
            </span>
            <button type="button" class="btn btn-danger btn-small" id="btn-delete-save">Delete</button>
          </div>
        </div>
      </section>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
